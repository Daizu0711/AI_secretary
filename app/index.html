<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AI秘書</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
:root{
  --bg:#f5f1e8; --bg2:#efe9dc; --card:rgba(255,255,255,.62); --card-strong:rgba(255,255,255,.85);
  --ink:#2a2620; --ink2:#7a7264; --line:rgba(42,38,32,.10);
  --accent:#ff7a1a; --accent2:#ff9a4d; --accent-soft:rgba(255,122,26,.12);
  --danger:#e04b3a; --ok:#3d9b6c;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --shadow:0 8px 32px rgba(42,38,32,.10), 0 1px 4px rgba(42,38,32,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro JP","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg);
  background-image:
    radial-gradient(1200px 700px at 85% -10%, rgba(255,154,77,.18), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(255,122,26,.10), transparent 55%);
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(42,38,32,.15);border-radius:4px}

/* ============ ロック画面 (HITMAN風) ============ */
#lock{
  position:fixed;inset:0;z-index:200;background:#0d0d0f;color:#e8e6e1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  transition:opacity .6s, visibility .6s;
}
#lock.open{opacity:1;visibility:visible}
#lock:not(.open){opacity:0;visibility:hidden;pointer-events:none}
#lock .brand{font-size:12px;letter-spacing:.55em;color:#8b8880;text-transform:uppercase}
#lock .brand b{color:var(--accent);font-weight:600}
#lock .panel{
  width:min(360px,86vw);padding:34px 30px 30px;border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.03);border-radius:6px;position:relative;
}
#lock .panel::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent)}
#lock .label{font-size:10px;letter-spacing:.4em;color:#8b8880;margin:18px 0 6px}
#lock .label:first-of-type{margin-top:0}
#lock .email{font-size:15px;color:#c9c6bf;padding:10px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:4px;word-break:break-all}
#lock input{
  width:100%;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
  border-radius:4px;color:#fff;font-size:17px;letter-spacing:.3em;outline:none;
}
#lock input:focus{border-color:var(--accent)}
#lock .status{
  margin-top:20px;font-size:12px;letter-spacing:.35em;min-height:18px;text-align:center;font-weight:600;
}
#lock .status.granted{color:#5ecf92}
#lock .status.denied{color:#e04b3a;animation:shake .4s}
#lock .welcome{font-size:13px;letter-spacing:.3em;color:#c9c6bf;min-height:18px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#lock .hint{font-size:11px;color:#5c5952;letter-spacing:.1em}

/* ============ アプリ骨格 ============ */
#app{display:flex;height:100dvh;opacity:0;transition:opacity .5s}
#app.ready{opacity:1}

/* サイドバー (Mac) */
#sidebar{
  width:232px;flex:none;padding:20px 14px;display:none;flex-direction:column;gap:4px;
  border-right:1px solid var(--line);background:var(--card);backdrop-filter:blur(24px);
}
#sidebar .logo{font-size:18px;font-weight:700;padding:10px 12px 18px;display:flex;align-items:center;gap:8px}
#sidebar .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.navbtn{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);
  font-size:14px;color:var(--ink2);text-align:left;position:relative;transition:.15s;
}
.navbtn:hover{background:rgba(255,255,255,.5)}
.navbtn.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.navbtn .bicon{width:20px;text-align:center}
.badge{
  margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);
  color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;
}
.badge.show{display:inline-flex}
.badge.red{background:var(--danger)}
#sidebar .spacer{flex:1}
#sidebar .mini{font-size:11px;color:var(--ink2);padding:8px 12px;line-height:1.7}

/* メイン列 */
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{
  display:flex;align-items:center;gap:12px;padding:14px 20px 10px;
}
#topbar h1{font-size:21px;font-weight:700;letter-spacing:.02em}
#searchWrap{flex:1;max-width:420px;margin-left:auto;position:relative}
#search{
  width:100%;padding:9px 14px 9px 34px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);backdrop-filter:blur(16px);font-size:14px;outline:none;
}
#search:focus{border-color:var(--accent2)}
#searchWrap::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink2);font-size:16px}

#views{flex:1;overflow-y:auto;padding:6px 20px 110px;scroll-behavior:smooth}
.view{display:none;max-width:860px;margin:0 auto;animation:fadein .25s}
.view.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* カード */
.card{
  background:var(--card);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  border:1px solid rgba(255,255,255,.65);border-radius:var(--r-lg);box-shadow:var(--shadow);
}
.secttl{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.12em;margin:26px 4px 10px;display:flex;align-items:center;gap:8px}
.secttl::after{content:"";flex:1;height:1px;background:var(--line)}

/* ============ 今日: 時間チップ & タイムライン ============ */
#availChips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#availChips .lbl{font-size:13px;color:var(--ink2);margin-right:2px}
.chip{
  padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;
  background:var(--card-strong);border:1.5px solid var(--line);transition:.15s;
}
.chip:hover{border-color:var(--accent2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(255,122,26,.35)}
#planMeta{font-size:12px;color:var(--ink2);margin-top:8px}
#planMeta .warn{color:var(--danger);font-weight:600}

#nextOne{margin-top:14px;padding:16px 18px;display:flex;align-items:center;gap:14px}
#nextOne .k{font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:700}
#nextOne .t{font-size:16px;font-weight:600;margin-top:2px}
#nextOne .sub{font-size:12px;color:var(--ink2);margin-top:2px}
#nextOne button{margin-left:auto;padding:9px 18px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}

#timelineWrap{display:flex;gap:14px;align-items:flex-start;margin-top:4px}
#timeline{flex:1;position:relative;min-width:0}
.tl-hour{display:flex;align-items:flex-start;height:56px;position:relative}
.tl-hour .hh{flex:none;width:46px;font-size:11px;color:var(--ink2);text-align:right;padding-right:10px;transform:translateY(-7px)}
.tl-hour .hl{flex:1;border-top:1px solid var(--line)}
.tl-block{
  position:absolute;left:56px;right:6px;border-radius:var(--r-md);padding:8px 12px;overflow:hidden;
  font-size:13px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);
  background:var(--card-strong);backdrop-filter:blur(12px);
}
.tl-block .bt{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-block .bs{font-size:11px;color:var(--ink2);margin-top:1px}
.tl-block.fixed{border-left:4px solid var(--accent)}
.tl-block.done{opacity:.45}
.tl-block.done .bt{text-decoration:line-through}
.tl-block.proposal{
  background:rgba(255,122,26,.10);border:1.5px dashed var(--accent);box-shadow:none;cursor:pointer;
  backdrop-filter:blur(6px);
}
.tl-block.proposal:hover{background:rgba(255,122,26,.18)}
.tl-block.proposal .bt::before{content:"提案 · ";color:var(--accent);font-weight:800}
.tl-block.breakb{background:transparent;border:1px dashed var(--line);box-shadow:none;color:var(--ink2);font-size:11px;display:flex;align-items:center}
.tl-nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:5;pointer-events:none}
.tl-nowline::before{content:"";position:absolute;left:40px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}

#todayList{flex:1;min-width:0;max-width:380px}

/* ============ アイテム行 ============ */
.item{
  display:flex;align-items:flex-start;gap:12px;padding:13px 16px;margin-bottom:10px;
  border-radius:var(--r-md);transition:.15s;
}
.item:hover{transform:translateY(-1px)}
.item .chk{
  flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:.15s;
}
.item .chk.done{background:var(--ok);border-color:var(--ok)}
.item .main{flex:1;min-width:0}
.item .tt{font-size:15px;font-weight:600;word-break:break-word}
.item .tt.done{text-decoration:line-through;color:var(--ink2)}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:11px;color:var(--ink2)}
.pill{padding:2px 9px;border-radius:999px;background:rgba(42,38,32,.06);font-size:11px}
.pill.due-soon{background:var(--accent-soft);color:var(--accent);font-weight:700}
.pill.overdue{background:rgba(224,75,58,.12);color:var(--danger);font-weight:700}
.pill.pri-high{background:rgba(224,75,58,.10);color:var(--danger)}
.item .acts{display:flex;gap:4px;flex:none}
.iconbtn{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink2);transition:.15s}
.iconbtn:hover{background:rgba(42,38,32,.07);color:var(--ink)}
.item .body{font-size:13px;color:var(--ink2);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.empty{padding:44px 20px;text-align:center;color:var(--ink2);font-size:14px}
.empty .big{font-size:34px;margin-bottom:10px}

/* 追加フォーム */
#addBar{padding:12px 14px;display:flex;gap:10px;align-items:center;margin-bottom:14px}
#addBar input{flex:1;border:none;background:transparent;outline:none;font-size:15px}
#addBar .send{flex:none;width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;font-size:17px;font-weight:700}

/* ============ チャット ============ */
#chat{
  width:380px;flex:none;border-left:1px solid var(--line);display:none;flex-direction:column;
  background:var(--card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
}
#chat header{padding:16px 18px 12px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
#chat header .st{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#chatLog{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;animation:fadein .2s}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--card-strong);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg.sys{align-self:center;background:transparent;color:var(--ink2);font-size:11px;box-shadow:none;border:none}
.prop{
  align-self:stretch;background:var(--card-strong);border:1.5px solid var(--accent2);border-radius:var(--r-md);
  padding:12px 14px;box-shadow:var(--shadow);animation:fadein .2s;
}
.prop .ph{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.prop .pt{font-size:14px;font-weight:600;margin:5px 0 3px}
.prop .pd{font-size:12px;color:var(--ink2);white-space:pre-wrap}
.prop .pbtns{display:flex;gap:8px;margin-top:10px}
.prop .pbtns button{flex:1;padding:8px;border-radius:10px;font-size:13px;font-weight:700}
.prop .okb{background:var(--accent);color:#fff}
.prop .ngb{background:rgba(42,38,32,.07);color:var(--ink2)}
.prop.resolved{opacity:.55;pointer-events:none}
.prop.resolved .pbtns{display:none}
#chatInput{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#chatText{
  flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;outline:none;
  background:var(--card-strong);resize:none;max-height:100px;
}
#chatText:focus{border-color:var(--accent2)}
#voiceBtn,#chatSend{flex:none;width:42px;height:42px;border-radius:50%;font-size:16px}
#chatSend{background:var(--accent);color:#fff}
#voiceBtn{background:var(--card-strong);border:1px solid var(--line)}
#voiceBtn.rec{background:var(--danger);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,75,58,.4)}50%{box-shadow:0 0 0 9px rgba(224,75,58,0)}}

/* ============ 下タブ (iPhone) ============ */
#tabbar{
  position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;
  display:none;gap:2px;padding:7px;border-radius:999px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 34px rgba(42,38,32,.16);
}
#tabbar button{
  flex:1;padding:9px 0 7px;border-radius:999px;font-size:10px;color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;
}
#tabbar button .ti{font-size:19px;line-height:1}
#tabbar button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
#tabbar .badge{position:absolute;top:2px;right:calc(50% - 22px);margin:0}

/* ============ トースト / モーダル ============ */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:120;
  background:#2a2620;color:#f5f1e8;padding:12px 20px;border-radius:14px;font-size:14px;
  display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);
  max-width:90vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{color:var(--accent2);font-weight:700;font-size:14px}
#modalWrap{
  position:fixed;inset:0;z-index:110;background:rgba(42,38,32,.35);backdrop-filter:blur(6px);
  display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;
}
#modalWrap.open{display:flex}
#modal{width:min(520px,100%);max-height:76vh;overflow-y:auto;padding:22px}
#modal h3{font-size:16px;margin-bottom:14px}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.frow input,.frow textarea,.frow select{
  width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--card-strong);font-size:14px;outline:none;
}
.frow input:focus,.frow textarea:focus{border-color:var(--accent2)}
.frow2{display:flex;gap:10px}.frow2 .frow{flex:1}
#modal .mbtns{display:flex;gap:10px;margin-top:18px}
#modal .mbtns button{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:14px}
#modal .saveb{background:var(--accent);color:#fff}
#modal .cancelb{background:rgba(42,38,32,.07)}

/* 設定 */
.setrow{display:flex;align-items:center;gap:12px;padding:15px 18px;margin-bottom:10px;border-radius:var(--r-md)}
.setrow .sl{flex:1}
.setrow .st{font-size:14px;font-weight:600}
.setrow .sd{font-size:12px;color:var(--ink2);margin-top:2px}
.setrow input[type=text],.setrow input[type=password],.setrow input[type=number]{width:180px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card-strong);font-size:13px}
.switch{width:46px;height:27px;border-radius:999px;background:rgba(42,38,32,.15);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{left:22px}
.memrow{padding:11px 16px;margin-bottom:8px;border-radius:var(--r-md);display:flex;gap:10px;align-items:center;font-size:13px}
.memrow .x{margin-left:auto}

/* ============ レスポンシブ ============ */
@media (min-width:768px){
  #chat{display:flex}
  #chatFab{display:none!important}
}
@media (min-width:768px) and (max-width:1199px){
  #sidebar{display:none}
  #views{padding-bottom:30px}
}
@media (min-width:1200px){
  #sidebar{display:flex}
  #tabbar{display:none!important}
  #views{padding-bottom:30px}
}
@media (max-width:1199px){
  #tabbar{display:flex}
}
@media (min-width:1200px){
  #topbar .only-mobile{display:none}
}
@media (max-width:767px){
  #topbar{padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
  #topbar h1{font-size:19px}
  #views{padding:4px 14px 120px}
  #timelineWrap{flex-direction:column}
  #todayList{max-width:none;width:100%}
  #chat{
    position:fixed;inset:0;z-index:90;width:100%;border:none;
    transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,.35,1);
  }
  #chat.open{transform:none}
}
#chatFab{
  position:fixed;right:18px;bottom:96px;z-index:60;width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:22px;box-shadow:0 8px 24px rgba(255,122,26,.45);
}
#chatClose{display:none}
@media (max-width:767px){#chatClose{display:block;margin-left:auto;color:var(--ink2)}}
.hide{display:none!important}
.kbd{font-size:11px;background:rgba(42,38,32,.08);padding:2px 6px;border-radius:5px;color:var(--ink2)}
</style>
</head>
<body>
