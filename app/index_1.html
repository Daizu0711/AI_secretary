<!DOCTYPE html>
<html lang="ja" data-theme="auto" data-accent="orange" data-density="cozy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="秘書">
<meta name="theme-color" content="#f6f2ea">
<meta name="description" content="予定・課題・メモを、ひとりの秘書と。">
<title>AI秘書</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ===================== ロック画面 (HITMAN風) ===================== -->
<div id="lock" class="show">
  <div class="lock-brand">AI秘書<span>SECURE ACCESS</span></div>
  <form class="lock-stage" id="lockForm" novalidate>
    <button type="button" class="lock-who hide" id="lockWho" tabindex="-1" aria-label="アカウントを変更"></button>
    <label class="lock-label" id="lockLabel" for="lockField">PASSWORD</label>
    <div class="lock-box" id="lockBox">
      <div class="lock-dots" id="lockDots"></div>
      <input class="lock-field" id="lockField" name="password" type="password" autocomplete="current-password"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Password" maxlength="128">
      <div class="lock-state" id="lockState" aria-live="polite"></div>
    </div>
    <div class="lock-hint" id="lockHint" aria-live="polite"></div>
    <input type="text" id="lockId" name="username" autocomplete="username" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" tabindex="-1" aria-hidden="true">
  </form>
</div>
<div id="curtain"><span>WELCOME</span></div>

<!-- ===================== アプリ本体 ===================== -->
<div id="app" data-view="today">
  <aside id="sidebar" aria-label="ナビゲーション">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2.5l2.4 6.4 6.6 2.6-6.6 2.6L12 21.5l-2.4-7.4L3 11.5l6.6-2.6z" fill="currentColor" stroke="none"/></svg>
      </span>
      <div class="brand-text"><b>秘書</b><span>AI Secretary</span></div>
    </div>
    <nav id="sideNav" class="side-nav"></nav>
    <div class="side-foot">
      <div class="side-stat" id="sideStat"></div>
      <button class="side-user" id="sideUser" type="button" aria-label="アカウント設定">
        <span class="avatar" id="sideAvatar">S</span>
        <span class="side-user-mail" id="sideMail">—</span>
        <svg class="ic" aria-hidden="true"><use href="#i-chevron-right"/></svg>
      </button>
    </div>
  </aside>

  <div id="main" class="main">
    <header id="topbar" class="topbar">
      <div class="topbar-title">
        <h1 id="pageTitle">今日</h1>
        <span id="pageSub" class="topbar-sub"></span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="searchBtn" type="button" aria-label="検索とコマンド (⌘K)" title="検索とコマンド (⌘K)">
          <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        </button>
        <button class="icon-btn" id="newBtn" type="button" aria-label="新規作成" title="新規作成 (N)">
          <svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="テーマを切り替える" title="テーマ">
          <svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
        <button class="icon-btn only-wide" id="chatToggle" type="button" aria-label="秘書パネルを開閉" title="秘書パネル">
          <svg class="ic" aria-hidden="true"><use href="#i-panel"/></svg>
        </button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <aside id="chatPane" class="chat-pane" aria-label="秘書">
    <header id="chatHead">
      <div class="orb" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2.5l2.4 6.4 6.6 2.6-6.6 2.6L12 21.5l-2.4-7.4L3 11.5l6.6-2.6z" fill="currentColor" stroke="none"/></svg>
      </div>
      <div class="chat-id">
        <b>秘書</b>
        <span class="chat-state"><i class="dot" id="aiDot"></i><span id="aiText">待機中</span></span>
      </div>
      <button class="icon-btn" id="chatClear" type="button" aria-label="会話履歴を消す" title="会話履歴を消す">
        <svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg>
      </button>
      <button class="icon-btn only-narrow" id="chatClose" type="button" aria-label="チャットを閉じる">
        <svg class="ic" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </header>
    <div id="msgs" role="log" aria-live="polite"></div>
    <button id="scrollDown" type="button" aria-label="最新のメッセージへ">
      <svg class="ic" aria-hidden="true"><use href="#i-chevron-down"/></svg>
    </button>
    <div id="prompts"></div>
    <div id="composer">
      <button id="mic" type="button" aria-label="音声入力" title="音声入力">
        <svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg>
      </button>
      <textarea id="q" rows="1" placeholder="秘書に話しかける…" enterkeyhint="send" autocomplete="off" aria-label="メッセージ"></textarea>
      <button id="send" type="button" aria-label="送信">
        <svg class="ic" aria-hidden="true"><use href="#i-send"/></svg>
      </button>
    </div>
  </aside>

  <nav id="tabbar" aria-label="タブ"></nav>
</div>

<!-- ===================== コマンドパレット ===================== -->
<dialog id="palette" class="palette">
  <div class="pal-input">
    <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
    <input id="palQ" type="text" placeholder="タスク・メモを検索、またはコマンドを実行" autocomplete="off" spellcheck="false" aria-label="検索とコマンド">
    <kbd>esc</kbd>
  </div>
  <div id="palList" class="pal-list" role="listbox"></div>
  <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 移動</span><span><kbd>↵</kbd> 決定</span><span><kbd>⌘K</kbd> いつでも</span></div>
</dialog>

<!-- ===================== 編集シート ===================== -->
<dialog id="editor" class="sheet">
  <form id="edForm" novalidate>
    <div class="sheet-grip" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="edTitle">タスクを編集</h2>
      <button class="icon-btn" id="edCancel" type="button" aria-label="閉じる">
        <svg class="ic" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </header>
    <div class="sheet-body">
      <label class="field-label" for="edT">タイトル</label>
      <input class="field field-title" id="edT" placeholder="何をしますか?" autocomplete="off">

      <label class="field-label" for="edB">メモ・詳細</label>
      <textarea class="field" id="edB" rows="3" placeholder="任意"></textarea>

      <div class="task-only">
        <label class="field-label" for="edD">期限</label>
        <input class="field" id="edD" type="datetime-local">
        <div class="chip-row" id="dueChips">
          <button type="button" class="chip" data-d="today">今日</button>
          <button type="button" class="chip" data-d="tomorrow">明日</button>
          <button type="button" class="chip" data-d="weekend">週末</button>
          <button type="button" class="chip" data-d="week">来週</button>
          <button type="button" class="chip" data-d="none">なし</button>
        </div>

        <div class="field-grid">
          <div>
            <label class="field-label" for="edE">見積り</label>
            <div class="input-suffix">
              <input class="field" id="edE" type="number" min="0" step="5" inputmode="numeric" placeholder="30">
              <span>分</span>
            </div>
          </div>
          <div>
            <label class="field-label" for="edC">カテゴリ</label>
            <input class="field" id="edC" list="catList" placeholder="化学 / EE / 生活">
            <datalist id="catList"></datalist>
          </div>
        </div>
        <div class="chip-row" id="estChips">
          <button type="button" class="chip" data-e="15">15分</button>
          <button type="button" class="chip" data-e="30">30分</button>
          <button type="button" class="chip" data-e="60">1時間</button>
          <button type="button" class="chip" data-e="120">2時間</button>
        </div>

        <span class="field-label">優先度</span>
        <div class="seg" id="edP" role="group" aria-label="優先度">
          <button type="button" data-p="0">低</button>
          <button type="button" data-p="1">中</button>
          <button type="button" data-p="2">高</button>
        </div>
      </div>

      <label class="switch-row">
        <span><b>AIに見せない</b><small>この項目はAIの文脈から除外します</small></span>
        <input type="checkbox" id="edH" class="switch">
      </label>
    </div>
    <footer class="sheet-foot">
      <button class="btn btn-danger-ghost" id="edDel" type="button">削除</button>
      <div class="sheet-foot-right">
        <button class="btn btn-ghost" id="edClose" type="button">キャンセル</button>
        <button class="btn btn-primary" id="edSave" type="submit">保存</button>
      </div>
    </footer>
  </form>
</dialog>

<!-- ===================== 集中モード ===================== -->
<div id="focus" class="focus" hidden aria-modal="true" role="dialog" aria-label="集中モード">
  <div class="focus-top">
    <span class="focus-label"><i class="dot"></i>FOCUS</span>
    <button class="icon-btn" id="focusClose" type="button" aria-label="集中モードを閉じる">
      <svg class="ic" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>
  <div class="focus-body">
    <p class="focus-task" id="focusTask">タスク</p>
    <div class="focus-ring" id="focusRing" style="--p:0">
      <div class="focus-ring-inner">
        <b id="focusTime">25:00</b>
        <span id="focusPhase">集中</span>
      </div>
    </div>
    <p class="focus-meta" id="focusMeta"></p>
  </div>
  <div class="focus-actions">
    <button class="btn btn-ghost" id="focusPause" type="button">
      <svg class="ic" aria-hidden="true"><use href="#i-pause"/></svg><span>一時停止</span>
    </button>
    <button class="btn btn-ghost" id="focusAdd" type="button">+5分</button>
    <button class="btn btn-primary" id="focusFinish" type="button">終了する</button>
  </div>
</div>

<!-- ===================== 共通パーツ ===================== -->
<dialog id="confirm">
  <h2 id="cfTitle">削除しますか?</h2>
  <p class="cf-msg" id="cfMsg"></p>
  <div class="cf-acts">
    <button class="btn btn-ghost" id="cfNo" type="button">キャンセル</button>
    <button class="btn btn-danger" id="cfYes" type="button">削除</button>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAct" type="button"></button></div>
<div id="netbar" role="status"><i></i><span id="netText">オフライン — 閲覧のみ</span></div>

<script>
  // ローカル開発時のみ、Supabase をモックしてUIを確認できる (?preview=1)
  (function () {
    var p = new URLSearchParams(location.search);
    if (p.has("preview") && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
      document.write('<script src="mock.js"><\/script>');
    }
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
